<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Trzcinski Z47_JS</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="font-size: 41px;">
        <script language="JavaScript">
            var L_kow = parseFloat(prompt("liczba=",""));
            var koniec_petli_kow = 12;
            if (L_kow%2==0) {
                for (i=1;i<=koniec_petli_kow;i++){
                    document.write("<font color=blue>Trzcinski"+"</font><br>");
                }
            } else {
                for (i=1;i<=koniec_petli_kow;i++){
                    document.write("<font color=green>Kacper"+"</font><br>");
                }
            }
            
        </script>
    </div>
    
</body>
</html>
