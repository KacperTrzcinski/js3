<!DOCTYPE html>
<head>
    <title>Trzcinski Z51_JS</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            var silnia_trz = 1;
            var n_trz = parseInt(prompt("n = ",""));
            for (var i_trz = 1; i_trz<=n_trz; i_trz++){
                silnia_trz*=i_trz;
            }
            document.write(n_trz + "! = " + silnia_trz.toFixed(0));
        </script>
    </div>
</body>
</html>
