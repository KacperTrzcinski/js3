<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Trzcinski Z46_JS</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color: red; font-size: 41px;">
        <script language="JavaScript">
            var koniec_petli_trz = 12;
            for(i_trz=1;i_trz<=koniec_petli_trz;i_trz++) {
                if (i_trz%2==0) {
                    document.write("Kacper"+"<br>");
                } else {
                    document.write("Trzcinski"+"<br>");
                }
            }
        </script>
    </div>
    
</body>
</html>
