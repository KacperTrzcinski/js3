<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Suma</title>
</head>

<body>

<div style="color: red; font-size: 50px;">
<script language="JavaScript">
    let suma_trz = 0;

    for (let i_t = 1; i_t <= 1000000; i_t++) {
        suma_trz = suma_trz + 1 / i_t;
    }

    document.write("suma = " + suma_trz.toFixed(2) + "<br>");
</script>
</div>

</body>
</html>
