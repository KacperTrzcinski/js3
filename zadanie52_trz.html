<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        document.write("<p style='color: red; font-size: 2cm;'> Trzcinski </p>");
        document.write("<p style='color: blue; font-size: 5mm;'> Przykład użycia pętli </p>");
        for (var i_trz=1; i_trz<=9; i_trz++){
            for (var k_trz=1; k_trz<=i_trz; k_trz++){
                document.write("&nbsp");
            }
            document.write(i_trz+"<br>");
        }
    </script>
</head>
<body>
</body>
</html>
