<!DOCTYPE html>
<head>
    <title>Sprawdzenie danych Trzcinski </title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript">
            do {
                var liczba1=prompt("wysokość=","");
                var h_trz=parseFloat(liczba1);
            } while (h_trz<=0);
            do {
                var liczba1=prompt("podstawę=","");
                var a_trz=parseFloat(liczba1);
            } while(!(a_trz>0));
            var Pole=a_trz*h_trz/2;
            document.write("Pole="+Pole.toFixed(2)+" cm^2"+"<br>");
        </script>
    </div>
</body>
</html>
