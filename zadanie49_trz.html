<!DOCTYPE html>
<head>
    <title>Trzcinski</title>
    <meta charset="utf-8">
</head>
<body>
    <div style="color:red;font-size:50px;">
        <script language="JavaScript"> //z49
            do {
                var a_trz=parseFloat(prompt("bok a=",""));
                var b_trz=parseFloat(prompt("bok b=",""));
                var c_trz=parseFloat(prompt("bok c=",""));
                document.write("sprawdzam warunki dla trójkąta wczytanych danych" + "<br>");
            } while (!((a_trz>0)&&(b_trz>0)&&(c_trz>0)&&(a_trz+b_trz>c_trz)&&(a_trz+c_trz>b_trz)&&(c_trz+b_trz>a_trz)));
            document.write("wyrok: trojkat sie zamyka oraz boki sa dodatnie");
        </script>
    </div>
</body>
</html>
