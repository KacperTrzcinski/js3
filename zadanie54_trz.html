<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title> Przykład użycia pętli </title>
    <script language="JavaScript">
        var a_trz = 6;
        var b_trz = 21;

        for (var j_trz = 1; j_trz <= b_trz; j_trz++) {
            document.write("*");
        }
        document.write("<br>");

        for (var i_trz = 1; i_trz <= a_trz - 2; i_trz++) {
            document.write("*");

            for (var j_trz = 1; j_trz <= b_trz - 2; j_trz++) {
                document.write("&nbsp;&nbsp;");
            }

            document.write("*<br>");
        }

        for (var j_trz = 1; j_trz <= b_trz; j_trz++) {
            document.write("*");
        }
        document.write("<br>");
    </script>
</head>
<body>
</body>
</html>
